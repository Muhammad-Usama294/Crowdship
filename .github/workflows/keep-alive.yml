name: Supabase Keep Alive

on:
  schedule:
    # Runs at 00:00 every Monday and Thursday (Twice a week is plenty!)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health Endpoint
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
            # Append this right below your curl step in keep-alive.yml
      - name: Keep GitHub Action Alive
        uses: gautamkrishnar/keepalive-workflow@v2
